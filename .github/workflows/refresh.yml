name: Refresh data

# Weekly: tags main as it is (before-refresh-YYYY-MM-DD, a restore point),
# fetches new publication data from NVA, OpenAlex and ORCID and rebuilds the
# pages with refresh.sh. If anything changed, it opens (or
# updates) a pull request to review; nothing is published until the pull
# request is merged.

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install pytest
      - name: Tag main before the refresh
        # A restore point, pushed to GitHub. Skipped when main has not changed
        # since it was last tagged; the time is added when today's tag exists.
        run: |
          head=$(git rev-parse HEAD)
          tag="before-refresh-$(date -u +%Y-%m-%d)"
          tags=$(git ls-remote --tags origin)
          if grep -q "^$head" <<<"$tags"; then
            tag=$(grep "^$head" <<<"$tags" | head -n 1 | sed -E 's#.*refs/tags/##; s#\^\{\}$##')
            echo "main is already tagged as $tag"
          else
            if grep -q "refs/tags/$tag$" <<<"$tags"; then
              tag="$tag-$(date -u +%H%M)"
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "main before the weekly refresh"
            git push origin "$tag"
          fi
          echo "RESTORE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Refresh and rebuild
        run: |
          ./refresh.sh | tee refresh.log
          {
            echo "Publication data refreshed from NVA, OpenAlex and ORCID by the weekly workflow."
            echo "\`main\` before the refresh is tagged \`$RESTORE_TAG\`."
            echo
            echo "Before merging, check the changes, in particular:"
            echo
            echo "- the review files written by \`nva/publication_data.py\` (duplicates, names, book editors)"
            echo "- new institutions that should be merged or excluded (\`partners/institution_merges.csv\`, \`partners/affiliation_exclusions.csv\`)"
            echo "- co-authors who appear as several people (\`partners/person_merges.csv\`), and Simula colleagues counted as co-authors (\`partners/simula_colleagues.csv\`)"
            echo
            echo "Key figures:"
            echo
            echo '```'
            sed -n '/^== Key figures/,$p' refresh.log | tail -n +2
            echo '```'
            echo
            echo "🤖 Generated with [Claude Code](https://claude.com/claude-code)"
          } > pr-body.md
          rm refresh.log
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: refresh-data
          delete-branch: true
          commit-message: Refresh data from NVA and OpenAlex
          title: Refresh data from NVA and OpenAlex
          body-path: pr-body.md
          add-paths: |
            nva/
            partners/
            centre/
            site/
